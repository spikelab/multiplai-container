# CI for multiplai-container — cheap, hermetic checks only.
#
# What runs: syntax checks over every shipped script, shellcheck over the
# scripts that pass it cleanly, the gateway allowlist harness (the only
# automated test of the container→host security boundary), and the git-hook
# secret-gate harness (the other one: it proves a secret cannot leave via a
# commit or a push, and that the custom sk-ant-* ruleset is actually loaded —
# upstream gitleaks defaults do not detect Anthropic credentials at all).
#
# What does NOT run, and why:
#   * `docker build` (the gate release.sh enforces locally). The image pulls the
#     Google Cloud SDK, Node, uv, bun, pandoc and typst — many minutes per run
#     on a hosted runner for a Dockerfile that changes rarely — and it needs
#     HOST_UID/HOST_GID/WORKSPACE build args that only make sense on a
#     developer's machine. `release.sh` refuses to cut a tag unless the build
#     passes there, which is where the check has teeth: nothing ships from CI.
#   * shellcheck over release.sh (SC1083 false positive on git's `@{u}` rev
#     syntax), container-build-gateway.sh (zsh — SC1071, unsupported by
#     shellcheck), and apple-containers-experiment.sh / tests/gateway-test.sh
#     (informational findings only). Tracked as an issue rather than fixed here.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh (the gateway is a zsh script)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: bash -n
        run: |
          for f in build.sh release.sh venv-sync-entrypoint.sh ab md2pdf \
                   apple-containers-experiment.sh tests/gateway-test.sh \
                   git-hooks/dispatch git-hooks/check-hookspath \
                   tests/git-hooks-test.sh; do
            echo "== $f"
            bash -n "$f"
          done
      - name: zsh -n (the zsh-only scripts)
        run: |
          for f in container-build-gateway.sh multiplai-gh-token; do
            echo "== $f"
            zsh -n "$f"
          done
      # Scripts invoked as ./script must carry the exec bit in git. (`ab`,
      # `md2pdf` and `git-hooks/dispatch` are COPY'd and chmod'ed by the
      # Dockerfile, so they are exempt.)
      - name: shipped scripts are executable
        run: |
          for f in build.sh release.sh venv-sync-entrypoint.sh \
                   container-build-gateway.sh apple-containers-experiment.sh \
                   multiplai-gh-token tests/gateway-test.sh \
                   tests/git-hooks-test.sh; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done

  shellcheck:
    name: shellcheck (clean scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck --version
        run: shellcheck --version
      - name: shellcheck
        run: |
          shellcheck build.sh venv-sync-entrypoint.sh ab md2pdf \
                     git-hooks/dispatch git-hooks/check-hookspath \
                     tests/git-hooks-test.sh

  git-hooks-tests:
    name: git hook secret-gate harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the same version AND checksum the Dockerfile installs, so CI
      # cannot pass against a binary the image never runs — and a re-tagged
      # release asset fails here the same way it fails the image build. Bump
      # version and SHA256 args together.
      - name: Install gitleaks (must match Dockerfile GITLEAKS_VERSION + SHA256)
        run: |
          ver="$(grep -oP 'ARG GITLEAKS_VERSION=\K[0-9.]+' Dockerfile)"
          test -n "$ver" || { echo "could not read GITLEAKS_VERSION"; exit 1; }
          sha="$(grep -oP 'ARG GITLEAKS_SHA256_X64=\K[0-9a-f]{64}' Dockerfile)"
          test -n "$sha" || { echo "could not read GITLEAKS_SHA256_X64"; exit 1; }
          echo "installing gitleaks $ver"
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  gitleaks.tgz" | sha256sum -c -
          sudo tar xzf gitleaks.tgz -C /usr/local/bin gitleaks
          rm gitleaks.tgz
          gitleaks version
      - name: tests/git-hooks-test.sh
        run: ./tests/git-hooks-test.sh

  gateway-tests:
    name: gateway allowlist harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: tests/gateway-test.sh
        run: ./tests/gateway-test.sh
